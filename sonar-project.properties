sonar.projectKey=livros
sonar.projectName=Livros
sonar.sources=app,routes,resources/views,resources/js,resources/css,public/js,database/migrations,database/seeders,config
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml
# PHPUnit mede o código PHP da aplicação. O JavaScript ainda não tem testes com cobertura.
sonar.coverage.exclusions=config/**,database/**,routes/**,public/js/**
# Configuração padrão e migrations de vínculos repetem estrutura por definição.
sonar.cpd.exclusions=config/**,database/migrations/**
